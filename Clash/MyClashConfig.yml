#---------------------------------------------------#
# 配置文件需要放置在 $HOME/.config/clash/config.yml
# 或者运行目录下的config.yml
#---------------------------------------------------#
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 8889
tproxy-port: 7894
allow-lan: false
mode: rule
log-level: warning
unified-delay: true
tcp-concurrent: true
ipv6: false
find-process-mode: strict
global-client-fingerprint: chrome
profile:
  store-selected: true
  store-fake-ip: true
